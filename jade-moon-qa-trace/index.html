<!doctype html>
<html lang="ru"><head><base href="../jade-moon-qa-r10/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#68cadd"><title>Нефритовая Луна</title><link rel="icon" href="data:,"><link rel="preload" as="image" href="assets/chapter-carp-v1.png"><link rel="stylesheet" href="src/ui/garden.css"><link rel="stylesheet" href="src/ui/progression.css"><link rel="stylesheet" href="src/ui/chapter.css"><link rel="stylesheet" href="src/ui/mobile.css"><link rel="preload" as="image" href="assets/chapter-panda-v1.png"></head><body>
<div id="landscape" aria-hidden="true"></div><div id="petals" aria-hidden="true"></div>
<main id="app">
 <header class="topbar"><button id="menu" class="round blue" aria-label="Настройки"></button><div id="header-title"></div><div class="header-right"><button id="records-home" class="round gold records-button" aria-label="Рекорды">♛</button><div class="star-wallet" aria-label="Звёзды"><span class="star">★</span><b id="star-total">0</b></div><button id="sound" class="round blue" aria-label="Переключить звук"></button><button id="help" class="round blue" aria-label="Как играть">?</button></div></header>
 <section id="home" class="screen home-screen">
  <div class="game-logo"><span>НЕФРИТОВАЯ ЛУНА</span><h1>МАДЖОНГ</h1><i class="logo-flower" aria-hidden="true">✿</i></div>
  <button id="season-home" class="season-banner" aria-label="Открыть сезон фонарей"></button>
  <div class="hero-tiles" aria-hidden="true"></div>
  <div class="play-area"><button id="play" class="play-button"><span>ИГРАТЬ</span><small id="play-label">Уровень 1</small></button><button id="difficulty-home" class="difficulty-chip"><span class="difficulty-dots">●●○○</span> <b>Гармония</b><span>⌄</span></button></div>
  <nav class="home-actions" aria-label="Разделы игры"><button id="levels-home" class="game-shortcut"><i class="object-icon icon-map"></i><b>Уровни</b></button><button id="daily-home" class="game-shortcut"><i class="object-icon icon-daily"></i><b>Задания</b></button><button id="collection-home" class="game-shortcut"><i class="object-icon icon-chest"></i><b>Мои костяшки</b></button></nav>
 </section>
 <section id="game" class="screen game-screen" hidden>
  <div class="game-heading"><button id="level-button">УРОВЕНЬ 1</button><h2 id="layout-title">Лотос</h2><button id="difficulty-label">Гармония</button></div>
  <div class="hud"><div><small id="score-label">ОЧКИ</small><strong id="score">0</strong></div><div class="pairs-medal"><strong id="remaining">26</strong><small>ПАР</small></div><div><small>ВРЕМЯ</small><strong id="timer">00:00</strong></div></div>
  <div id="match-stage"><div class="slot left"></div><span class="stage-spark">✦</span><div class="slot right"></div><span id="combo"></span></div>
  <div id="board-wrap"><div id="board"></div></div>
  <div class="tools"><button id="hint" title="Помощь исключает эту партию из рекордов"><i class="object-icon icon-hint"></i><b>Подсказка</b><small>5</small></button><button id="undo" title="Помощь исключает эту партию из рекордов"><i class="object-icon icon-undo"></i><b>Отмена</b></button><button id="shuffle" title="Помощь исключает эту партию из рекордов"><i class="object-icon icon-shuffle"></i><b>Смешать</b><small>3</small></button><button id="focus"><i class="object-icon icon-focus"></i><b>Свободные</b></button></div>
 </section>
 <section id="map" class="screen map-screen" hidden><div class="screen-ribbon"><h2>ПУТЕШЕСТВИЕ</h2><span id="map-range"></span></div><button id="chapter-reward" hidden></button><div id="map-stage"><svg id="map-path" viewBox="0 0 680 520" preserveAspectRatio="none" aria-hidden="true"></svg><div id="map-nodes"></div></div><div class="page-controls"><button id="map-prev" class="round gold" aria-label="Предыдущие уровни">‹</button><span id="map-page"></span><button id="map-next" class="round gold" aria-label="Следующие уровни">›</button></div></section>
 <section id="collection" class="screen collection-screen" hidden><div class="screen-ribbon"><h2>МОИ КОСТЯШКИ</h2><button id="achievements" class="mini-trophy" aria-label="Достижения"><i class="object-icon icon-trophy"></i></button></div><div class="collection-stage"><button id="set-prev" class="round gold" aria-label="Предыдущий набор">‹</button><div id="set-display"><div class="display-rays" aria-hidden="true"></div><div id="set-tiles" aria-hidden="true"></div><div class="display-plinth" aria-hidden="true"></div></div><button id="set-next" class="round gold" aria-label="Следующий набор">›</button></div><div class="set-info"><h3 id="set-name"></h3><div id="set-dots"></div><button id="set-choose" class="play-button"></button><div id="set-progress"></div></div></section>
</main>
<div id="dialog-backdrop" hidden><section id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><button id="close-dialog" class="round close-button" aria-label="Закрыть окно">×</button><div id="dialog-content"></div></section></div>
<div id="toast" role="status"></div><div id="effects" aria-hidden="true"></div><script src="vendor/browser-compat.js"></script><script src="vendor/vk-bridge.min.js"></script><script src="../jade-moon-qa-trace/trace.js"></script><script src="vendor/gamesmile-sdk-v1.js"></script><script type="module" src="src/garden.js"></script>
</body></html>
