<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Осуши озеро!</title>
  <!-- Пустая иконка: без неё браузер стучится за /favicon.ico и сорит 404 в консоль
       (ловилось смоук-тестом в двух играх подряд). Перед релизом заменить на иконку игры. -->
  <link rel="icon" href="data:,">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1d2b3a; }
    /* §1.6.2.7: без выделения текста/картинки и системного меню долгого тапа в игре */
    #game { width: 100vw; height: 100vh;
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent; touch-action: none; }
    canvas { display: block; }
    /* B11: статичный лоадер поверх фона — показывается СРАЗУ и держится, пока грузится
       SDK и создаётся Phaser. Без него первые секунды — пустой тёмный экран («игра не
       грузится», требование Яндекса к заявке CSP). main.js снимает его при старте Phaser. */
    #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #1d2b3a; z-index: 10; }
    #boot .spin { width: 52px; height: 52px; border: 5px solid #2f4258; border-top-color: #ffd54f; border-radius: 50%; animation: boot-rot 0.9s linear infinite; }
    @keyframes boot-rot { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="boot"><div class="spin"></div></div>

  <!-- SDK площадки тегом здесь НЕ подключается. Игра идёт на две площадки, и каждая
       грузит своё из своего адаптера (src/platform/adapters/): Яндекс — /sdk/v2 (сам
       добавляет ?draft, когда страница открыта черновиком), VK — локальный
       vendor/vk-bridge.min.js. Смысл именно в этом: внутри VK Mini Apps не должно быть
       ни одного обращения к хосту другой площадки (правила VK, п.4.2.6), а статический
       тег стучался бы на yandex.ru всегда. -->

  <!-- Phaser 3 лежит локально в vendor/: без внешних CDN, надёжнее на модерации -->
  <script src="vendor/phaser.min.js"></script>

  <script type="module" src="src/main.js"></script>
</body>
</html>
