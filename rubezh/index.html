<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Орбитальный рубеж</title>
    <!-- Путь относительный (base './'): игра живёт и в подпапке GitHub Pages для VK.
         Без этого тега браузер сам просит /favicon.ico в КОРНЕ домена и получает 404 —
         лишняя ошибка в консоли, за которой можно не заметить настоящую. -->
    <link rel="icon" type="image/png" href="favicon-32.png" />
    <!-- SDK площадки подключает src/sdk.js — сам, по факту площадки, и только когда нужен.
         В этом файле его нет сознательно: index.html отдаётся как есть и читается глазами. -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05060d;
        /* На десктопе взаимодействие с полем игры не должно выделять текст/картинку
           и вызывать браузерное поведение (отказ модерации, п.1.6.2.7). */
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
      }
      #game {
        width: 100%;
        height: 100%;
        /* SAFE ZONE (п.3.2.2 правил VK: учитывать вырез и системные полосы на мобильных).
           Раньше запас сверху получался случайно — из чёрных полос Scale.FIT. После правки
           масштабирования 14.08 канвас занимает окно целиком, и верхний HUD («Волна N»,
           кнопка паузы) оказался бы вплотную к вырезу. env(safe-area-inset-*) на устройствах
           без выреза равен нулю, поэтому на десктопе и обычных экранах ничего не меняется. */
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        box-sizing: border-box;
      }
      #game canvas {
        touch-action: none;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-CUmb5vwA.js"></script>
  </head>
  <body>
    <div id="game"></div>
  </body>
</html>
