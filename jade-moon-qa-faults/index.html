<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"><title>Jade R10 isolated fault acceptance</title>
<style>body{background:#102820;color:#fff;font:16px sans-serif;padding:12px;overflow-wrap:anywhere}p{margin:8px 0}.pass{color:#acf5c3}.fail{color:#ffb0b0}pre{white-space:pre-wrap;font:12px monospace}</style>
<h1>R10 isolated faults</h1><p>Injected Bridge only. No real SDK, ads or cloud writes. Unchanged release modules.</p><div id="status">RUNNING</div><div id="rows"></div><pre id="result"></pre>
<script type="module">
import {createVkAds} from './vk-ads.js';
import {createStorageBudget} from './storage-budget.js';
const sleep=ms=>new Promise(r=>setTimeout(r,ms)),defer=()=>{let resolve,reject;let promise=new Promise((r,j)=>{resolve=r;reject=j});return {promise,resolve,reject}};
const eq=(a,b,msg='')=>{if(JSON.stringify(a)!==JSON.stringify(b))throw Error(msg+JSON.stringify({actual:a,expected:b}))};
const rows=[],out=document.querySelector('#rows'),started=new Date().toISOString();
async function check(id,fn){let item={id};try{item.details=await fn();item.pass=true}catch(e){item.pass=false;item.error=String(e)}rows.push(item);const p=document.createElement('p');p.className=item.pass?'pass':'fail';p.textContent=(item.pass?'PASS ':'FAIL ')+id+' '+JSON.stringify(item.details??item.error);out.append(p);}
function ad(send,options={}){const locks=[],events=[],listeners=new Set();let faults=0;const bridge={send,subscribe:f=>listeners.add(f),unsubscribe:f=>listeners.delete(f)};const api=createVkAds({enabled:true,bridge,lock:v=>locks.push(v),event:v=>events.push(v),fault:()=>faults++,...options});return {api,locks,events,listeners,get faults(){return faults},emit:t=>{for(const f of listeners)f({detail:{type:t}})}}}
await check('reward_unavailable',async()=>{const calls=[];const h=ad(async m=>{calls.push(m);return {result:false}});eq(await h.api.showReward(),false);eq(calls,['VKWebAppCheckNativeAds']);eq(h.locks,[true,false]);eq(h.events,[]);return {showCalls:0,reward:0,unlocked:!h.api.busy}});
for(const mode of ['cancel','error'])await check('reward_'+mode,async()=>{const h=ad(async m=>{if(m==='VKWebAppCheckNativeAds')return {result:true};if(mode==='error')throw Error('injected failure');return {result:false}});eq(await h.api.showReward(),false);eq(h.events,[]);eq(h.locks,[true,false]);eq(h.listeners.size,0);return {reward:0,unlocked:!h.api.busy}});
await check('reward_duplicate',async()=>{const d=defer();let shows=0;const h=ad(async m=>m==='VKWebAppCheckNativeAds'?{result:true}:(shows++,d.promise));let p=h.api.showReward();await sleep(0);eq(await h.api.showReward(),false);d.resolve({result:true});eq(await p,true);eq(shows,1);eq(h.events,['reward_ad_shown']);return {shows,rewards:1}});
await check('late_callback_after_timeout',async()=>{const d=defer(),h=ad(async m=>m==='VKWebAppCheckNativeAds'?{result:true}:d.promise,{timeout:80});eq(await h.api.showReward(),false);d.resolve({result:true});await sleep(30);eq(h.events,[]);eq(h.locks,[true,false]);eq(h.faults,1);return {reward:0,faults:h.faults,unlocks:1}});
await check('slow_precheck_timeout',async()=>{let shows=0;const d=defer(),h=ad(async m=>m==='VKWebAppCheckNativeAds'?d.promise:(shows++,{result:true}));let t=performance.now();eq(await h.api.showReward(),false);let elapsed=Math.round(performance.now()-t);d.resolve({result:true});await sleep(30);eq(shows,0);eq(h.locks,[true,false]);return {elapsedMs:elapsed,shows,unlocked:!h.api.busy}});
await check('interstitial_cooldown',async()=>{let now=0,shows=0;const h=ad(async m=>{if(m==='VKWebAppShowNativeAds')shows++;return {result:true}},{clock:()=>now});now=119999;eq(await h.api.transition(),false);now=120000;eq(await h.api.transition(),true);now=239999;eq(await h.api.transition(),false);now=240000;eq(await h.api.transition(),true);eq(shows,2);return {injectedClock:true,thresholdMs:120000,shows}});
await check('interstitial_unavailable_retry',async()=>{let now=120000,inventory=false,shows=0;const h=ad(async m=>{if(m==='VKWebAppShowNativeAds')shows++;return {result:inventory}},{clock:()=>now});now=240000;eq(await h.api.transition(),false);inventory=true;eq(await h.api.transition(),true);eq(shows,1);return {unavailableConsumedCooldown:false,shows}});
await check('hidden_ad_keeps_waiting',async()=>{const d=defer();let h;h=ad(async m=>{if(m==='VKWebAppCheckNativeAds')return {result:true};h.emit('VKWebAppViewHide');return d.promise},{timeout:80});let p=h.api.showReward();await sleep(180);eq(h.faults,0);eq(h.api.busy,true);h.emit('VKWebAppViewRestore');d.resolve({result:true});eq(await p,true);eq(h.listeners.size,0);return {hiddenMs:180,visibleBudgetMs:80,restored:true}});
await check('missing_callback_after_restore',async()=>{let h;h=ad(async m=>{if(m==='VKWebAppCheckNativeAds')return {result:true};h.emit('VKWebAppViewHide');return new Promise(()=>{})},{timeout:80});let p=h.api.showReward();await sleep(120);eq(h.faults,0);h.emit('VKWebAppViewRestore');eq(await p,false);eq(h.faults,1);eq(h.listeners.size,0);return {faults:1,unlocked:!h.api.busy}});
function budget(){let time=100000;const data=new Map(),storage={getItem:k=>data.get(k),setItem:(k,v)=>data.set(k,v)};return {make:()=>createStorageBudget({key:'isolated-only',storage,now:()=>time}),advance:n=>time+=n}}
await check('storage_hour_budget',async()=>{const h=budget(),b=h.make();let writes=0;for(let s=0;s<3600;s++){if(b.delay(13)===0){b.begin(13);for(let n=0;n<13;n++){b.take();writes++}}h.advance(1000)}eq(writes,234);return {injectedClock:true,attemptedKeys:writes,maximum:240,cloudWrites:0}});
await check('storage_interval_reload',async()=>{const h=budget(),b=h.make();b.begin(3);b.take();eq(h.make().delay(3),30000);h.advance(30000);eq(h.make().delay(3),0);eq(h.make().inspect().writes.length,1);return {retainedWrites:1,intervalMs:30000}});
await check('storage_error9_cooldown',async()=>{const h=budget(),b=h.make();b.take();eq(b.reject({error_data:{error_code:9}}),true);eq(h.make().delay(),3600000);h.advance(3599999);eq(h.make().delay(),1);h.advance(1);eq(h.make().delay(),0);return {injectedClock:true,cooldownMs:3600000,cloudWrites:0}});
await check('storage_disk_failure_bounded',async()=>{const b=createStorageBudget({key:'isolated',storage:{getItem:()=>'{"writes":[],"next":0,"blocked":0}',setItem(){throw Error('injected quota')}},now:()=>100000});for(let n=0;n<240;n++)b.take();let code;try{b.take()}catch(e){code=e.code}eq(code,'STORAGE_BUDGET');eq(b.inspect().writes.length,240);return {retainedWrites:240,extraWriteBlocked:true}});
const result={schema:1,kind:'injected-bridge-and-memory-storage-in-native-webview',started,finished:new Date().toISOString(),userAgent:navigator.userAgent,cloudWrites:0,realAds:0,pass:rows.every(x=>x.pass),tests:rows};window.__jadeFaultResult=result;document.querySelector('#status').textContent='COMPLETE '+rows.filter(x=>x.pass).length+'/'+rows.length;document.querySelector('#result').textContent=JSON.stringify(result);document.title='FAULTS '+(result.pass?'PASS':'FAIL');
</script>
