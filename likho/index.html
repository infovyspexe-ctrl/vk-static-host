<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Лихо</title>
  <!-- Пустая иконка: без неё браузер стучится за /favicon.ico и сорит 404 в консоль
       (ловилось смоук-тестом в двух играх подряд). Перед релизом заменить на иконку игры. -->
  <link rel="icon" href="data:,">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* §1.6.2.7 модерации: взаимодействие с игрой не должно выделять текст/картинку
       и подсвечивать тап (JS в main.js гасит контекстное меню, CSS — выделение). */
    html, body { width: 100%; height: 100%; overflow: hidden; background: #16121c;
      user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent; touch-action: none; }
    /* 100vh на мобильном браузере считает полную высоту экрана ВКЛЮЧАЯ место под
       адресную строку, даже когда та скрыта — низ игры (нижние кнопки/HUD) уезжает
       за реально видимую область. 100dvh (динамическая высота вьюпорта) пересчитывается
       браузером САМ при скрытии/показе адресной строки; 100vh — фолбэк для старых
       браузеров без поддержки dvh, применяется первым и перекрывается dvh, если он есть.
       См. также main.js: JS-фолбэк на visualViewport.resize для браузеров/случаев,
       где dvh есть, но событие изменения вьюпорта не долетает до Phaser сразу. */
    #game { width: 100vw; height: 100vh; height: 100dvh; }
    canvas { display: block; }
    /* Статичный лоадер поверх пустого фона: показывается СРАЗУ при открытии и держится,
       пока грузится площадка (SDK) и создаётся Phaser. Без него первые секунды — пустой
       тёмный экран, который читается как «игра не грузится» (и валит требование Яндекса
       к заявке CSP «игра запускается без доступа к хостам»). main.js убирает его, когда
       стартует Phaser и появляется своя полоса загрузки. Цвет спиннера — под тему игры. */
    #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #16121c; z-index: 10; }
    #boot .spin { width: 52px; height: 52px; border: 5px solid #312841; border-top-color: #e0a33c; border-radius: 50%; animation: boot-rot 0.9s linear infinite; }
    @keyframes boot-rot { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="boot"><div class="spin"></div></div>

  <!-- Yandex Games SDK. Грузим ТОЛЬКО внутри iframe площадки. Вне его (локальный сервер,
       открытие файлом) SDK не находит родительское окно и на одной только самоинициализации
       валит два десятка «No parent to post message» — за этим шумом не видно настоящих
       ошибок игры. Внутри площадки поведение не меняется: тег вставляется так же, до
       модулей, с тем же URL.  для разработки, build.py сам убирает его
       при сборке релиза (простой заменой подстроки — она работает и здесь). -->
  <script>
    (function () {
      var inFrame = true;
      try { inFrame = window !== window.parent; } catch (e) { inFrame = true; } // кросс-origin parent — тоже iframe
      if (!inFrame) return;
      var s = document.createElement('script');
      s.async = false; // сохранить порядок выполнения, как у обычного тега
      s.src = 'https://yandex.ru/games/sdk/v2';
      document.head.appendChild(s);
    })();
  </script>

  <!-- VK Bridge (VK Mini Apps = VK + ОК + Mail.ru) — локально в vendor/, не с CDN
       (CONVENTIONS.md §15: сторонний домен режут антивирусы игроков). Безвредно вне VK:
       адаптер зовётся только когда слой определил площадку по launch-параметрам URL. -->
  <script src="vendor/vk-bridge.min.js"></script>

  <!-- Phaser 3 лежит локально в vendor/: без внешних CDN, надёжнее на модерации -->
  <script src="vendor/phaser.min.js"></script>

  <script type="module" src="src/main.js"></script>
</body>
</html>
