<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка сохранения</title><script src="../jade-moon-qa-r9/vendor/vk-bridge.min.js"></script><style>body{font:12px monospace;overflow-wrap:anywhere;background:white;color:black}pre{white-space:pre-wrap}</style><h1>Чтение локального сохранения</h1><pre id="report"></pre><script>
(async()=>{await vkBridge.send('VKWebAppInit',{});const result={at:Date.now(),pending:[],budget:[]};for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key.startsWith('jadeMoon_vk_pending_'))result.pending.push({conflict:key.endsWith('_conflict'),value:JSON.parse(localStorage.getItem(key))});if(key.startsWith('jadeMoon_vk_budget_'))result.budget.push(JSON.parse(localStorage.getItem(key)));}document.querySelector('#report').textContent=JSON.stringify(result);})();
</script>
<button id="repair" style="position:fixed;bottom:15px;left:15px;font-size:22px">Восстановить связь сохранения</button><script>
document.querySelector('#repair').onclick=async()=>{try{const account=new URLSearchParams(location.search).get('vk_user_id')||'current',key='jadeMoon_vk_pending_'+account,raw=localStorage.getItem(key),pending=JSON.parse(raw);if(!pending?.data)throw Error('No pending snapshot');const read=async keys=>new Map((await vkBridge.send('VKWebAppStorageGet',{keys})).keys.map(x=>[x.key,x.value]));const manifestKey='jadeMoon_manifest_v1',current=(await read([manifestKey])).get(manifestKey),a=JSON.parse(pending.base),b=JSON.parse(current);if(a.v!==2||b.v!==1||b.revision!==a.revision+1)throw Error('Not the known compatibility conversion');const payload=async m=>{const keys=Array.from({length:m.parts},(_,i)=>'jadeMoon_data_v1_'+(m.v===1?m.bank:m.generation)+'_'+i),parts=await read(keys);if(keys.some(k=>!parts.get(k)))throw Error('Missing source chunks');return keys.map(k=>parts.get(k)).join('');};if(await payload(a)!==await payload(b))throw Error('Cloud payload changed; refusing');if((await read([manifestKey])).get(manifestKey)!==current||localStorage.getItem(key)!==raw)throw Error('Concurrent change');localStorage.setItem('jadeMoon_qa_recovery_backup',raw);pending.base=current;localStorage.setItem(key,JSON.stringify(pending));document.querySelector('#report').textContent=JSON.stringify({repaired:true,cloudWrites:0,identicalBasePayload:true,localGameplayUnchanged:true,level:pending.data.session.level,score:pending.data.session.score});document.querySelector('#repair').disabled=true;}catch(e){document.querySelector('#report').textContent=String(e);}};
</script>
